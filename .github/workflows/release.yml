name: release

# The tag is literally "release", so pushing it again is what ships the next
# build. The version is not in the tag and not in Cargo.toml either, it is the
# minute this workflow started, stamped before anything gets built.
on:
  push:
    tags:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup show
          rustc -vV

      # Before the build, because cargo reads the version out of the
      # environment and the inno script reads the ini this writes. One number
      # for the whole run, and it is the time the build started.
      - name: Stamp the version
        id: ver
        shell: pwsh
        run: |
          & installer\stamp-version.ps1
          $line = (Get-Content target\version.ini | Select-String '^Version=').Line
          if (-not $line) { throw "stamp wrote no version" }
          $v = $line.Split('=')[1].Trim()
          if ($v -notmatch '^\d+\.\d+\.\d{8}\.\d{4}$') { throw "bad version stamp: $v" }
          "CHEESESTRAP_VERSION=$v" >> $env:GITHUB_ENV
          "version=$v"                   >> $env:GITHUB_OUTPUT
          "setup=Cheesestrap-Setup-$v-x64.exe" >> $env:GITHUB_OUTPUT
          "title=cheesestrap $v"         >> $env:GITHUB_OUTPUT
          Write-Output "shipping $v"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc-release

      - name: Build the app
        run: cargo build --release --locked

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw "ISCC.exe not found" }
            "ISCC_EXE=$($found.FullName)" >> $env:GITHUB_ENV
          } else {
            "ISCC_EXE=$iscc" >> $env:GITHUB_ENV
          }
          Write-Output "using $env:ISCC_EXE"

      - name: Build the setup exe
        shell: pwsh
        run: |
          & $env:ISCC /Qp "/DMyAppVersion=$env:CHEESESTRAP_VERSION" "installer\Cheesestrap.iss"

      # The version names itself, so this only trips when the tag was pushed
      # twice inside one minute. Refuse rather than overwrite.
      - name: "Guard: the version has to move"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET: ${{ steps.ver.outputs.setup }}
        run: |
          $assets = gh release view release --json assets --jq ".assets[].name" 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets -contains $env:ASSET) {
            throw "$($env:ASSET) is already published, this tag went out twice in the same minute."
          }
          Write-Output "version $($env:VERSION) has not shipped yet, good"

      # Release notes are the newest entry in the readme changelog. The heading
      # is whatever we wrote, the version is generated at build time and cannot
      # be a heading we typed in advance, so take the first entry instead of
      # looking for a match.
      - name: Take the newest changelog entry from the readme
        id: notes
        shell: pwsh
        run: |
          $lines = Get-Content README.md
          $start = ($lines | Select-String '^##\s+Changelog\s*$' | Select-Object -First 1).LineNumber
          if (-not $start) { throw "no ## Changelog heading in README.md" }
          $body = @()
          $inside = $false
          foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match '^##\s') { break }
            if ($line -match '^###\s') {
              if ($inside) { break }   # stop at the second entry
              $inside = $true
              continue
            }
            if ($inside) { $body += $line }
          }
          $notes = ($body -join "`n").Trim()
          if (-not $notes) { $notes = "no notes for this build" }
          # heredoc form, nothing but the notes between the markers or they
          # end up in the release body
          "body<<CHANGELOG_EOF" >> $env:GITHUB_OUTPUT
          $notes          >> $env:GITHUB_OUTPUT
          "CHANGELOG_EOF"  >> $env:GITHUB_OUTPUT

      # gh is preinstalled and picks up GITHUB_TOKEN, so the same tag being
      # pushed twice updates the existing release instead of failing.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: release
          TITLE: ${{ steps.ver.outputs.title }}
          NOTES: ${{ steps.notes.outputs.body }}
          ASSET: ${{ steps.ver.outputs.setup }}
        run: |
          $exe = "installer\output\$env:ASSET"
          if (-not (Test-Path $exe)) { throw "setup exe not built: $exe" }
          Write-Output "asset $((Get-Item $exe).Length) bytes"

          $existing = gh release view $env:TAG --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            gh release upload $env:TAG $exe --clobber
            # one setup per release, the app always points people at the newest
            foreach ($a in (gh release view $env:TAG --json assets --jq ".assets[].name")) {
              if ($a -like "Cheesestrap-Setup-*.exe" -and $a -ne $env:ASSET) {
                Write-Output "dropping stale asset $a"
                gh release delete-asset $env:TAG $a --yes
              }
            }
            gh release edit $env:TAG --title $env:TITLE --notes $env:NOTES --latest
          } else {
            gh release create $env:TAG $exe --title $env:TITLE --notes $env:NOTES --latest
          }
          gh release view $env:TAG --json tagName,name,assets --jq '.'