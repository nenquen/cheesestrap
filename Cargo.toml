[package]
name = "cheesestrap"
version = "1.0.6"
edition = "2021"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
ratatui = "0.30.2"
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
zip = "8.6.0"
dirs = "7.0.0"
winreg = "0.56.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell"] }

[build-dependencies]
winres = "0.1.12"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ico = "0.5.0"
